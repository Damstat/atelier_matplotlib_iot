[project]
name = "atelier-matplotlib-iot"
version = "0.1.0"
description = ""
authors = [
    {name = "Adama Sarr",email = "adamasarr7837@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]

[tool.poetry]
packages = [{include = "atelier_matplotlib_iot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
